apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: backend-service
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: MCP_SERVER_URL
              value: "http://catalog-mcp-service:8001/mcp/sse"
            - name: PROJECT_ID
              value: "sre-demos"
            - name: FIRESTORE_DATABASE
              value: "sre-genai"
            - name: CORE_MODEL
              value: "gemini-3.7-flash"
            - name: GUARDRAIL_MODEL
              value: "gemini-3.5-flash-lite"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
