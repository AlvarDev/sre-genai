apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: frontend-service
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: NUXT_PUBLIC_BACKEND_GEMINI_URL
              value: "http://localhost:8080"
            - name: NUXT_PUBLIC_BACKEND_GEMMA_URL
              value: "http://localhost:8081"
            - name: NUXT_PUBLIC_FIREBASE_API_KEY
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: FIREBASE_API_KEY
            - name: NUXT_PUBLIC_FIREBASE_PROJECT_ID
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: PROJECT_ID
            - name: NUXT_PUBLIC_FIREBASE_AUTH_DOMAIN
              value: "$(NUXT_PUBLIC_FIREBASE_PROJECT_ID).firebaseapp.com"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
