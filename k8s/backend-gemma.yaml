apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-gemma-deployment
  labels:
    app: backend-gemma
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend-gemma
  template:
    metadata:
      labels:
        app: backend-gemma
    spec:
      containers:
        - name: backend-gemma
          image: backend-gemma-service
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "2000m"
              memory: "5Gi"
            limits:
              cpu: "4000m"
              memory: "7Gi"
          env:
            - name: PORT
              value: "8080"
            - name: MCP_SERVER_URL
              value: "http://catalog-mcp-service:8001/mcp/sse"
            - name: PROJECT_ID
              value: "sre-demos"
            - name: FIRESTORE_DATABASE
              value: "sre-genai"
            - name: CORE_MODEL
              value: "gemma4:e4b"
            - name: GUARDRAIL_MODEL
              value: "gemini-3.5-flash-lite"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-gemma-service
spec:
  selector:
    app: backend-gemma
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
