apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-gemma-deployment
  labels:
    app: backend-gemma
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend-gemma
  template:
    metadata:
      labels:
        app: backend-gemma
    spec:
      containers:
        - name: backend-gemma
          image: backend-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          env:
            - name: PORT
              value: "8080"
            - name: SERVICE_NAME
              value: "backend-gemma"
            - name: MCP_SERVER_URL
              value: "http://catalog-mcp-service:8001/mcp/sse"
            - name: PROJECT_ID
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: PROJECT_ID
            - name: FIRESTORE_DATABASE
              value: "sre-genai"
            - name: CORE_MODEL
              value: "gemma-4-e2b"
            - name: GUARDRAIL_MODEL
              value: "gemini-3.5-flash-lite"
            - name: INFERENCE_ENDPOINT
              value: "http://localhost:11434/v1"
        - name: inference-sidecar
          image: southamerica-east1-docker.pkg.dev/sre-demos/sre-genai/llama-server:latest
          imagePullPolicy: IfNotPresent
          args:
            - "-m"
            - "/models/gemma-4-E2B-it-Q4_K_M.gguf"
            - "--load-mode"
            - "none"
            - "-c"
            - "4096"
            - "-np"
            - "1"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "11434"
            - "--threads"
            - "4"
            - "--temp"
            - "1.0"
            - "--top-p"
            - "0.95"
            - "--top-k"
            - "64"
            - "--reasoning"
            - "off"
          readinessProbe:
            httpGet:
              path: /health
              port: 11434
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 2
          resources:
            requests:
              cpu: "1000m"
              memory: "2500Mi"
            limits:
              cpu: "3000m"
              memory: "4000Mi"
          volumeMounts:
            - name: gemma-models-volume
              mountPath: /models
      volumes:
        - name: gemma-models-volume
          hostPath:
            path: /var/models
---
apiVersion: v1
kind: Service
metadata:
  name: backend-gemma-service
spec:
  selector:
    app: backend-gemma
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
