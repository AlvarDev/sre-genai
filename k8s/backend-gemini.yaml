apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-gemini-deployment
  labels:
    app: backend-gemini
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-gemini
  template:
    metadata:
      labels:
        app: backend-gemini
    spec:
      containers:
        - name: backend-gemini
          image: backend-service
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: SERVICE_NAME
              value: "backend-gemini"
            - name: MCP_SERVER_URL
              value: "http://catalog-mcp-service:8001/mcp/sse"
            - name: PROJECT_ID
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: PROJECT_ID
            - name: FIRESTORE_DATABASE
              value: "sre-genai"
            - name: CORE_MODEL
              value: "gemini-3.8-flash"
            - name: GUARDRAIL_MODEL
              value: "gemini-3.5-flash-lite"
            - name: GEMINI_LOCATION
              value: "us"
            - name: VERTEX_PROMPT_LOCATION
              value: "southamerica-east1"
            - name: VERTEX_PROMPT_ID
              value: "5019446502657884160"
            - name: OTEL_SEMCONV_STABILITY_OPT_IN
              value: "gen_ai_latest_experimental"
            - name: OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT
              value: "EVENT_ONLY"
            - name: ADK_CAPTURE_MESSAGE_CONTENT_IN_SPANS
              value: "false"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-gemini-service
spec:
  selector:
    app: backend-gemini
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
