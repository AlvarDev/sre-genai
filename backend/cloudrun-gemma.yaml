apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: backend-gemma
  labels:
    cloud.googleapis.com/location: southamerica-east1
  annotations:
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: backend-sa@PROJECT_ID_PLACEHOLDER.iam.gserviceaccount.com
      volumes:
        - name: gemma-models-volume
          csi:
            driver: gcsfuse.run.googleapis.com
            readOnly: true
            volumeAttributes:
              bucketName: PROJECT_ID_PLACEHOLDER-files
      containers:
        # Ingress Container: FastAPI Backend
        - name: backend-service
          image: southamerica-east1-docker.pkg.dev/PROJECT_ID_PLACEHOLDER/sre-genai/backend-service:latest
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "1000m"
              memory: "2Gi"
          env:
            - name: PROJECT_ID
              value: "PROJECT_ID_PLACEHOLDER"
            - name: LOCATION
              value: "us"
            - name: FIRESTORE_DATABASE
              value: "sre-genai"
            - name: MCP_SERVER_URL
              value: "https://catalog-mcp-server-PROJECT_NUMBER_PLACEHOLDER.southamerica-east1.run.app/mcp/sse"
            - name: CORE_MODEL
              value: "gemma-4-e2b"
            - name: GUARDRAIL_MODEL
              value: "gemini-3.5-flash-lite"
            - name: INFERENCE_ENDPOINT
              value: "http://localhost:11434/v1"
        # Sidecar Container: Gemma 4 E2B Inference Engine
        - name: inference-sidecar
          image: southamerica-east1-docker.pkg.dev/PROJECT_ID_PLACEHOLDER/sre-genai/llama-server:latest
          args:
            - "-m"
            - "/models/gemma-4-E2B-it-Q4_K_M.gguf"
            - "--load-mode"
            - "none"
            - "-c"
            - "4096"
            - "-np"
            - "1"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "11434"
            - "--threads"
            - "4"
            - "--temp"
            - "1.0"
            - "--top-p"
            - "0.95"
            - "--top-k"
            - "64"
            - "--reasoning"
            - "off"
          startupProbe:
            httpGet:
              path: /health
              port: 11434
            initialDelaySeconds: 2
            periodSeconds: 2
            failureThreshold: 30
            timeoutSeconds: 2
          resources:
            limits:
              cpu: "4000m"
              memory: "6Gi"
          volumeMounts:
            - name: gemma-models-volume
              mountPath: /models
