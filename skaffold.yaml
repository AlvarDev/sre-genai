apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: sre-genai-minikube
build:
  local:
    push: false
  artifacts:
    - image: backend-service
      context: backend
      docker:
        dockerfile: Dockerfile
    - image: catalog-mcp-server
      context: catalog-mcp
      docker:
        dockerfile: Dockerfile
    - image: frontend-service
      context: frontend
      docker:
        dockerfile: Dockerfile
manifests:
  rawYaml:
    - k8s/backend-gemini.yaml
    - k8s/backend-gemma.yaml
    - k8s/catalog-mcp.yaml
    - k8s/frontend.yaml
deploy:
  kubectl:
    hooks:
      before:
        - host:
            command: ["sh", "-c", "kubectl create configmap app-config --from-literal=PROJECT_ID=$(gcloud config get-value project 2>/dev/null) --dry-run=client -o yaml | kubectl apply -f -"]
portForward:
  - resourceType: Service
    resourceName: frontend-service
    port: 3000
    localPort: 3000
  - resourceType: Service
    resourceName: backend-gemini-service
    port: 8080
    localPort: 8080
  - resourceType: Service
    resourceName: backend-gemma-service
    port: 8080
    localPort: 8081
profiles:
  - name: backends-only
    build:
      artifacts:
        - image: backend-service
          context: backend
          docker:
            dockerfile: Dockerfile
        - image: catalog-mcp-server
          context: catalog-mcp
          docker:
            dockerfile: Dockerfile
    manifests:
      rawYaml:
        - k8s/backend-gemini.yaml
        - k8s/backend-gemma.yaml
        - k8s/catalog-mcp.yaml
    portForward:
      - resourceType: Service
        resourceName: backend-gemini-service
        port: 8080
        localPort: 8080
      - resourceType: Service
        resourceName: backend-gemma-service
        port: 8080
        localPort: 8081
